<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="roundedSquare">
      <rect x="16" y="16" width="480" height="480" rx="108" ry="108"/>
    </clipPath>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5AC8FA"/>
      <stop offset="100%" stop-color="#0A84FF"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#roundedSquare)">
    <!-- Bottom half: white -->
    <rect x="0" y="0" width="512" height="512" fill="#FFFFFF"/>

    <!-- Top half: blue gradient -->
    <rect x="0" y="0" width="512" height="256" fill="url(#blueGrad)"/>

    <!-- Subtle dividing line for depth -->
    <rect x="0" y="254" width="512" height="4" fill="#E5E5E7"/>

    <!-- Folder glyph, centered, straddling the divide -->
    <g transform="translate(256 256)">
      <path
        d="M -110 -46
           L -40 -46
           L -20 -20
           L 110 -20
           L 110 70
           A 14 14 0 0 1 96 84
           L -96 84
           A 14 14 0 0 1 -110 70
           Z"
        fill="#FFFFFF"
        stroke="#0A84FF"
        stroke-width="6"
      />
      <!-- Minus badge indicating "deselect" -->
      <rect x="-28" y="-6" width="56" height="14" rx="7" fill="#FF3B30"/>
    </g>
  </g>

  <!-- Outer border to match macOS rounded-square icon convention -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108"
        fill="none" stroke="#D1D1D6" stroke-width="2"/>
</svg>
